# Shell over Telnet
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y
CONFIG_SHELL_PROMPT_TELNET="telnet:~$ "

# Keep logs on SWO, not through the shell
CONFIG_SHELL_LOG_BACKEND=n

# More network resources for Telnet/TCP
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=20
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=50
