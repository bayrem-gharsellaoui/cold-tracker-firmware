# Logging
CONFIG_LOG=y
CONFIG_LOG_INFO_COLOR_GREEN=y
CONFIG_LOG_DBG_COLOR_BLUE=y

# Shell
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y

# Sensor
# ADC
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y

# Storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y

# C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# No heap
CONFIG_HEAP_MEM_POOL_SIZE=0

# servz
CONFIG_SERVZ=y
CONFIG_SERVZ_LOG_LEVEL_DBG=y

# Debugging
CONFIG_DEBUG=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
