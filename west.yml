manifest:
  version: 0.7

  defaults:
    remote: zephyrproject

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      repo-path: zephyr
      revision: v4.4.2
      path: zephyr
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - hal_espressif
          - mcuboot
          - mbedtls
          - tf-psa-crypto

  self:
    path: application
