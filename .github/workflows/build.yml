name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Minimal firmware
          - board: native_sim
            snippets: ""
            sysbuild: ""

          # Native simulator networking
          - board: native_sim
            snippets: "-S net -S nsos -- -DSNIPPET_ROOT=\"$PWD\""
            sysbuild: ""

          # Nucleo USB NCM + OTA
          - board: nucleo_u575zi_q
            snippets: "-S net -S ncm -S ota -- -DSNIPPET_ROOT=\"$PWD\""
            sysbuild: "--sysbuild"

          # Nucleo PPP + SWO + OTA
          - board: nucleo_u575zi_q
            snippets: "-S net -S ppp -S swo -S ota -- -DSNIPPET_ROOT=\"$PWD\""
            sysbuild: "--sysbuild"

          # XIAO Wi-Fi + OTA
          - board: xiao_esp32c3
            snippets: "-S net -S wifi -S ota -- -DSNIPPET_ROOT=\"$PWD\""
            sysbuild: "--sysbuild"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: application

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr environment
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: application
          toolchains: arm-zephyr-eabi:riscv64-zephyr-elf

      # Required by the ESP32 HAL
      - name: Fetch ESP32 binary blobs
        if: matrix.board == 'xiao_esp32c3'
        run: west blobs fetch hal_espressif

      - name: Build
        working-directory: application
        run: |
          west build \
            -b ${{ matrix.board }} \
            -p \
            ${{ matrix.sysbuild }} \
            ${{ matrix.snippets }}

      # Minimal native_sim is only a CI check.
      - name: Upload release asset
        if: github.event_name == 'release' && matrix.snippets != ''
        working-directory: application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.board }}" = "native_sim" ]; then
            FILE=$(find build/zephyr \
              -maxdepth 1 \
              -name 'coldtracker-*.exe' \
              -print -quit)
          else
            FILE=$(find build/application/zephyr \
              -maxdepth 1 \
              -name 'coldtracker-*.signed.bin' \
              -print -quit)
          fi

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "$FILE" \
            --clobber
