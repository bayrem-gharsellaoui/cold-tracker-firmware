name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Minimal firmware
          - board: native_sim
            snippets: ""
            sysbuild: false

          # Native simulator networking
          - board: native_sim
            snippets: "net;nsos"
            sysbuild: false

          # Nucleo USB NCM + OTA
          - board: nucleo_u575zi_q
            snippets: "net;ncm;ota"
            sysbuild: true

          # Nucleo PPP + SWO + OTA
          - board: nucleo_u575zi_q
            snippets: "net;ppp;swo;ota"
            sysbuild: true

          # XIAO Wi-Fi + OTA
          - board: xiao_esp32c3
            snippets: "net;wifi;ota"
            sysbuild: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: application

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr environment
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: application
          toolchains: arm-zephyr-eabi:riscv64-zephyr-elf

      # Required by the ESP32 HAL
      - name: Fetch ESP32 binary blobs
        if: matrix.board == 'xiao_esp32c3'
        run: west blobs fetch hal_espressif

      - name: Build
        working-directory: application
        run: |
          if [ "${{ matrix.sysbuild }}" = "true" ]; then
            # Scope snippets to the ColdTracker image, not MCUboot.
            west build \
              -b ${{ matrix.board }} \
              -p \
              --sysbuild \
              -- \
              -DSNIPPET_ROOT="$PWD" \
              -Dapplication_SNIPPET="${{ matrix.snippets }}"
          else
            # Normal non-sysbuild build.
            SNIPPET_ARGS=()

            IFS=';' read -ra SNIPPETS <<< "${{ matrix.snippets }}"
            for snippet in "${SNIPPETS[@]}"; do
              if [ -n "$snippet" ]; then
                SNIPPET_ARGS+=("-S" "$snippet")
              fi
            done

            west build \
              -b ${{ matrix.board }} \
              -p \
              "${SNIPPET_ARGS[@]}" \
              -- \
              -DSNIPPET_ROOT="$PWD"
          fi

      # Minimal native_sim is only a CI check.
      - name: Upload release asset
        if: github.event_name == 'release' && matrix.snippets != ''
        working-directory: application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.board }}" = "native_sim" ]; then
            FILE=$(find build/zephyr \
              -maxdepth 1 \
              -name 'coldtracker-*.exe' \
              -print -quit)
          else
            FILE=$(find build/application/zephyr \
              -maxdepth 1 \
              -name 'coldtracker-*.signed.bin' \
              -print -quit)
          fi

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "$FILE" \
            --clobber
