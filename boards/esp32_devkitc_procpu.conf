# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y

# Networking
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=5200
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_STATISTICS=n
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=10000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=64
CONFIG_NET_MGMT_EVENT_STACK_SIZE=10240

# Stack Sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=4096

# Logging
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_IPV4_LOG_LEVEL_DBG=n
CONFIG_NET_TCP_LOG_LEVEL_DBG=n
CONFIG_SHELL_LOG_LEVEL_DBG=n
CONFIG_SOC_LOG_LEVEL_DBG=n
CONFIG_NET_DEBUG_MGMT_EVENT_STACK=n
CONFIG_DEBUG_COREDUMP=y
