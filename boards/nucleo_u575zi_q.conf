# USB CDC NCM
CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_SAMPLE_USBD_MANUFACTURER="Techleef"
CONFIG_SAMPLE_USBD_PRODUCT="ColdTracker"
CONFIG_SAMPLE_USBD_PID=0x0001

# Ethernet over USB
CONFIG_NET_L2_ETHERNET=y

# Network configuration is started manually after USB is enabled
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_DHCPV4=y

# Stack
CONFIG_MAIN_STACK_SIZE=4096

# Logging
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_USBD_CDC_NCM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
